# Nginx reverse proxy สำหรับ SUP Space Maeklong
# วางไฟล์นี้ที่:  /etc/nginx/sites-available/sup-space
# แล้ว enable:    ln -s /etc/nginx/sites-available/sup-space /etc/nginx/sites-enabled/
# ทดสอบ + reload: nginx -t && systemctl reload nginx
#
# เปลี่ยน your-domain.com เป็นโดเมนจริงของคุณก่อนใช้งาน
# หลังรันคำสั่งนี้ certbot จะเติมส่วน SSL (443) ให้อัตโนมัติ:
#   certbot --nginx -d your-domain.com -d www.your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # ขนาดไฟล์อัปโหลดสูงสุด (เผื่อรูป/ฟอร์ม)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ให้ Next.js static assets cache ยาว ๆ
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
